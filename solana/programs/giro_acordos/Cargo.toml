[package]
name = "giro_acordos"
version = "0.1.0"
description = "GIRO — acordos de receita entre vendedor e fornecedor (fase local)"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "giro_acordos"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Versões exatas (regra do plano: fixar). Conferir na Fase 0 se 1.2.0 continua a estável.
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
